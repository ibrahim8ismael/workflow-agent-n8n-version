services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: woops
      POSTGRES_PASSWORD: woops
      POSTGRES_DB: woops
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U woops']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: woops
      MINIO_ROOT_PASSWORD: woops123
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: woops-backend:latest
    build:
      context: .
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://woops:woops@postgres:5432/woops
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: woops-backend:latest
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://woops:woops@postgres:5432/woops
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://minio:9000/woops-assets
    ports:
      - 3000:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  miniodata:
