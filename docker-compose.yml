services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: woops
      POSTGRES_PASSWORD: woops
      POSTGRES_DB: woops
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U woops']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: woops
      MINIO_ROOT_PASSWORD: woops123
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: woops-backend:latest
    build:
      context: .
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://woops:woops@postgres:5432/woops
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["app"] # opt-in only: local dev runs the Mac-native backend; compose provides infra
    image: woops-backend:latest
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://woops:woops@postgres:5432/woops
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://minio:9000/woops-assets
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''

    ports:
      - ${PORT:-4000}:${PORT:-4000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT:-4000}/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  miniodata:
