name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: woops
          POSTGRES_PASSWORD: woops
          POSTGRES_DB: woops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate database
        env:
          DATABASE_URL: postgresql://woops:woops@localhost:5432/woops_test
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        env:
          DATABASE_URL: postgresql://woops:woops@localhost:5432/woops_test
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t woops-backend:ci .
